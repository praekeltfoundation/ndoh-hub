name: Run tests

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres_version: ['14','16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres_version }}
        env:
          POSTGRES_DB: ndoh_hub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
      redis:
        image: redis:6.0
        ports:
          - 6379:6379
    env:
      HUB_DATABASE: postgres://postgres:postgres@localhost:5432/ndoh_hub
    steps:
      - uses: actions/checkout@v4
      - name: Install gettext
        run: sudo apt-get install gettext
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}-pip
      - uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install pipx
        run: python -m pip install pipx

      - name: Ensure pipx path
        run: python -m pipx ensurepath

      - name: Install uv with pipx
        run: python -m pipx install uv
      - name: Install dependancies
        run: |
          uv sync --dev
      - name: Check formatting
        # Lints/tests should always run, even if other lints/tests have failed.
        if: success() || failure() && steps.install-deps.outcome == 'success'
        run: |
          uv run ruff format --check
      - name: Lint
        if: success() || failure() && steps.install-deps.outcome == 'success'
        run: |
          uv run ruff check
      - name: Run migrations
        if: success() || failure() && steps.install-deps.outcome == 'success'
        run: |
          uv run ./manage.py makemigrations --dry-run | grep 'No changes detected' || (echo 'There are changes which require migrations.' && exit 1)
      - name: Run tests
        if: success() || failure() && steps.install-deps.outcome == 'success'
        run: |
          uv run pytest -vv

